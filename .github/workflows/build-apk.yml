name: Build Tallulah Audio Lab APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tallulah-Audio-Lab-3.0-2026-11-15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tallulah-Audio-Lab-3.0-2026-11-15
          path: Tallulah-Audio-Lab-3.0-2026-11-15.apk
