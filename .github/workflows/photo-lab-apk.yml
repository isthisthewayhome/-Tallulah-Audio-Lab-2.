name: Build Photo Lab APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Tallulah-Photo-Lab/**'
      - '.github/workflows/photo-lab-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Tallulah-Photo-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pretrained ESRGAN 4x model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/esrgan.tar.gz 'https://www.kaggle.com/models/kaggle/esrgan-tf2/TfLite/esrgan-tf2/1/download/'
          mkdir -p /tmp/esrgan-unpack app/src/main/assets
          tar -xzf /tmp/esrgan.tar.gz -C /tmp/esrgan-unpack
          find /tmp/esrgan-unpack -type f -name '*.tflite' -print
          model="$(find /tmp/esrgan-unpack -type f -name '*.tflite' -print -quit)"
          test -n "$model"
          cp "$model" app/src/main/assets/upscale_x4.tflite
          test "$(stat -c%s app/src/main/assets/upscale_x4.tflite)" -gt 100000
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tallulah-Photo-Lab-debug-APK
          path: Tallulah-Photo-Lab/app/build/outputs/apk/debug/*.apk
