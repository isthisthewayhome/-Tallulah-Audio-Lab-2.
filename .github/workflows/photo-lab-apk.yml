name: Build Photo Lab APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Tallulah-Photo-Lab/**'
      - '.github/workflows/photo-lab-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Tallulah-Photo-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tallulah-Photo-Lab-debug-APK
          path: Tallulah-Photo-Lab/app/build/outputs/apk/debug/*.apk
