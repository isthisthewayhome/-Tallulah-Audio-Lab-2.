name: Build Photo Lab APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Tallulah-Photo-Lab/**'
      - '.github/workflows/photo-lab-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Tallulah-Photo-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pretrained ESRGAN 4x model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/upscale_x4.tflite 'https://huggingface.co/qualcomm/ESRGAN/resolve/0538bfc6790a83a36d7237bf17f57e34246e7d1f/ESRGAN.tflite'
          echo 'd146a0051f9c1f7b183bbbfee391857a2fad2bdd37caff53d6c8c5c1f3bb7cc2  app/src/main/assets/upscale_x4.tflite' | sha256sum --check
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tallulah-Photo-Lab-debug-APK
          path: Tallulah-Photo-Lab/app/build/outputs/apk/debug/*.apk
