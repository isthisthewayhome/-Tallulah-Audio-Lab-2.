<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Tallulah Audio Lab 2</title><style>body{background:#101018;color:#f4eafa;font:16px system-ui;margin:24px}button,input{accent-color:#b080d8}button{background:#553b70;color:white;border:0;border-radius:10px;padding:12px;margin:5px}section{background:#22212c;border-radius:12px;padding:12px;margin:12px 0}small{color:#c9b6d3}</style></head><body><h1>🎧 Tallulah Audio Lab 2.0</h1><small>Alpha · 2026-11-15 · Existing v1.8 remains separate</small><p><input type="file" id="files" accept="audio/*" multiple></p><button id="play">Play all</button><button id="pause">Pause all</button><div id="tracks"></div><p><small>Project recovery compatibility is not implemented in this alpha. Keep your original backups safe.</small></p><script>const tracks=[];document.getElementById('files').onchange=e=>{for(const f of e.target.files){const url=URL.createObjectURL(f),audio=new Audio(url);tracks.push(audio);const el=document.createElement('section');const title=document.createElement('strong');title.textContent=f.name;el.append(title);const vol=document.createElement('input');vol.type='range';vol.min=0;vol.max=100;vol.value=100;vol.oninput=()=>audio.volume=Number(vol.value)/100;el.append(document.createElement('br'),vol);const loop=document.createElement('label');loop.textContent=' Loop ';const check=document.createElement('input');check.type='checkbox';check.onchange=()=>audio.loop=check.checked;loop.append(check);el.append(loop);document.getElementById('tracks').append(el);}};document.getElementById('play').onclick=()=>tracks.forEach(a=>a.play().catch(()=>{}));document.getElementById('pause').onclick=()=>tracks.forEach(a=>a.pause());</script></body></html>
